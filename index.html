  var r = recv(), i = -1, p = sc.kind === "gtin" ? C.scanQty(it, sc.gtin) : (it.p || 1);   // a case code adds the case (task 3.1)
  r.lines.forEach(function (l, k) { if (i < 0 && l.id === id) i = k; });
  if (i < 0) { r.lines.push({ id: id, text: "", how: "hand", vendorQty: null, uom: "", per: {}, each: p, exp: [], note: "", flag: "", why: "", st: "ok", got: null, src: "hand" }); i = r.lines.length - 1; }
  else if (r.lines[i].src === "hand") { r.lines[i].each = C.num(r.lines[i].each) + p; r.lines[i].st = "ok"; }
  if (sc.exp) r.lines[i].exp = C.uniqDates((r.lines[i].exp || []).concat([sc.exp]));
  // 3.2 / 3.2b: a dropped separator was split by the date's fixed length: the line goes to Needs a look with the reason (added to one it has), Save waits
  if (sc.split) { var ln = r.lines[i]; ln.flag = "check"; ln.st = ""; ln.why = /Lot and date read as one/.test(ln.why || "") ? ln.why : ((ln.why ? ln.why + " · " : "") + "Lot and date read as one"); }
  if (!r.src) r.src = "hand";
  saveRecv(); render.keepScroll = true; render();
  return { ok: true, msg: it.n + " · " + stockQty(it, p), row: "#rc" + i };   // the box's own quantity ("1 pack of 5"); the bar's count carries the rest (review 2)
}
function unknownBtn() { var n = LS.get("unknown", []).length; return n ? '<button class="btn" data-act="unknownDown">Unknown codes (' + n + ")</button>" : ""; }
ACT.unknownDown = function () { xlDownload("unknown_codes_" + today() + ".xlsx", "Codes", C.UNKNOWN_HEAD, C.unknownRows(LS.get("unknown", []))); };

/* ---------- teach-once (task 3.1): a product code nobody knows asks "Which item?" once. The answer rides to the shared settings through
   the outbox (form 32: ItemsData.gtin for the warehouse, the lab item's labov.gtin), works here at once, and the scan goes on as if the
   code had been known. Cancel keeps nothing: the next scan asks again. ---------- */
var TEACH = null, LABPICK = { dept: "" };
function teachAsk(sc) {
  TEACH = { sc: sc };
  if (S.mode === "lab") openLabPicker(); else openItemPicker("teach", "Which item?");
}
var TEACH_UNDO_MS = 5000;   // the settings write waits out the toast's Undo (as a packed slip does), so an Undo never loses to the upload
function teachSave(teach) { var cid = uid(); queueWrite("settings", null, { cid: cid, teach: teach }, TEACH_UNDO_MS); return cid; }
// what the scan is about to change, so Undo puts back that one line: Receive's line for the item, a delivery's row for the key
function teachSnap(id, key) {
  if (S.mode === "lab") { var dl = S.tab === "ldeliv" && S.ldl; return dl ? { lab: key, was: dl.vals[key] ? JSON.stringify(dl.vals[key]) : null } : null; }
  if (S.view === "count" && S.count) return null;
  var r = recv(), i = -1; r.lines.forEach(function (l, k) { if (i < 0 && l.id === id) i = k; });
  return { id: id, was: i >= 0 ? JSON.stringify(r.lines[i]) : null };
}
// what the taught scan added: the pieces on Receive's line, the count units on the delivery's row (the line before and after it)
function teachAdded(snap) {
  if (!snap) return 0;
  var was = snap.was ? JSON.parse(snap.was) : null;
  if (snap.lab) { var dl = S.ldl, v = dl && dl.vals[snap.lab]; return v ? C.num(v.q) - (was ? C.num(was.q) : 0) : 0; }
  var l = recv().lines.filter(function (x) { return x.id === snap.id; })[0];
  return l ? C.num(l.each) - (was ? C.num(was.each) : 0) : 0;
}
// Undo takes off only what the taught scan added (3.1b): a line it made goes when nothing else was scanned onto it since
function teachRestore(snap, added) {
  if (!snap) return;
  if (snap.lab) {
    var dl = S.ldl, v = dl && dl.vals[snap.lab]; if (!v) return;
    var q = C.num(v.q) - added;
    if (!snap.was && q <= 0) delete dl.vals[snap.lab]; else v.q = q > 0 ? String(q) : "";
    LS.set("ldl", dl); return;
  }
  var r = recv(), i = -1; r.lines.forEach(function (l, k) { if (i < 0 && l.id === snap.id) i = k; });
  if (i < 0) return;
  var e = C.num(r.lines[i].each) - added;
  if (!snap.was && e <= 0) r.lines.splice(i, 1); else r.lines[i].each = Math.max(0, e);
  saveRecv();
}
// the answer: the code is kept for every device, the scan goes on, and Undo (5 s) takes both back - what the scan added and the code
// (the held write is dropped; one that went out already is followed by an unteaching write). Where the scan cannot apply
// (an item not in this count) nothing is kept and the next scan asks again (3.1b, steer 08:44 #4)
function teachApply(teach, untaught, id, key) {
  var t = TEACH; TEACH = null; if (!t) return;
  var snap = teachSnap(id, key), cid = teachSave(teach), r = scanApply(t.sc), added = teachAdded(snap);
  var unteach = function () {
    if (S.outbox.some(function (o) { return o.cid === cid; })) { S.outbox = S.outbox.filter(function (o) { return o.cid !== cid; }); saveOutbox(); refreshSettings(); }
    else teachSave(untaught);
  };
  if (!r.ok) { unteach(); toast(r.msg || "Not in this count"); render.keepScroll = true; render(); return; }
  uiFlash(r.row && $(r.row), null);
  toastUndo(r.msg || "Saved", function () { if (r.undo) r.undo(); else teachRestore(snap, added); unteach(); render.keepScroll = true; render(); }, TEACH_UNDO_MS);   // a scan with its own undo (the last-one mark, 3.5b) is taken back with the code
}
function teachPicked(id) {   // the warehouse picker's answer
  if (!TEACH || !id) return;
  var teach = { items: {} }, un = { items: {} }; teach.items[TEACH.sc.gtin] = id; un.items[TEACH.sc.gtin] = "";
  teachApply(teach, un, id, null);
}
ACT.teachLab = function (el) {   // the lab picker's answer
  var key = el.getAttribute("data-key"); closeSheet(); if (!TEACH || !key) return;
  var teach = { lab: {} }, un = { lab: {} }; teach.lab[TEACH.sc.gtin] = key; un.lab[TEACH.sc.gtin] = "";
  teachApply(teach, un, null, key);
};
// Cancel on Which item? forgets the question (3.1b): the next sheet's Search key is its own, and the next scan asks afresh
ACT.closeSheet = (function (orig) { return function (el, e) { if (TEACH) { TEACH = null; if (pickTarget === "teach") pickTarget = null; } return orig(el, e); }; })(ACT.closeSheet);
function openLabPicker() {
  LABPICK.dept = S.tab === "ldeliv" && S.ldl ? S.ldl.dept : S.lcnt ? S.lcnt.dept : "";
  openSheet("Which item?", '<input id="pickQ" type="search" placeholder="Type part of a name" aria-label="Search items" data-in="labPickQ" data-enter="pickFirst" autocomplete="off"><div id="pickRes" class="results">' + labPickResults("") + "</div>",
    '<button class="btn" data-act="closeSheet">Cancel</button>', true);
  $("#sheet").setAttribute("data-kind", "picker");
}
// the department's items, whole and by section (no query); every lab item on a search, the department's first, 60 at most.
// A row says what the box says: the pack and the REF number (design review 3.1)
function labPickResults(q) {
  q = (q || "").toLowerCase().trim();
  var words = q.split(/\s+/).filter(Boolean), dept = LABPICK.dept, out = "", lastSec = null;
  var list = LCAT.filter(function (it) {
    if (!words.length) return !dept || it.dept === dept;
    var hay = (it.name + " " + (it.section || "") + " " + it.dept + " " + (it.refNo || "")).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) >= 0; });
  }).sort(function (a, b) { return (a.dept === dept ? 0 : 1) - (b.dept === dept ? 0 : 1); });
  if (words.length) list = list.slice(0, 60);
  if (!list.length) return '<div class="muted">No item matches “' + esc(q) + '”.</div>';
  list.forEach(function (it) {
    var sec = it.section || "";
    if (!words.length && sec !== lastSec) { lastSec = sec; out += '<div class="zone">' + esc(sec || it.dept) + "</div>"; }   // the app's group head
    var sub = [words.length && it.dept !== dept ? it.dept : "", String(it.pack || it.unit || "").toLowerCase(), it.refNo ? "REF " + it.refNo : ""].filter(Boolean).join(" · ");
    out += '<button class="res" data-act="teachLab" data-key="' + esc(it.key) + '"><span class="nm">' + esc(it.name) + "<small>" + esc(sub) + "</small></span></button>";
  });
  return out;
}
IN.labPickQ = function (el) { $("#pickRes").innerHTML = labPickResults(el.value); };

/* ---------- app updates (8.4): the new version waits, then goes in when nothing is lost or interrupted ---------- */
var UPD = { reg: null, waiting: false, applying: false };
function updCounting() { return !!S.count || (S.mode === "lab" && S.tab === "lcount" && !!S.lcnt); }
function updCheck() {
  var w = !!(UPD.reg && UPD.reg.waiting && UPD.reg.active);
  if (w !== UPD.waiting) { UPD.waiting = w; if (!S.station) softRender(); }
  if (C.updateStep({ waiting: UPD.waiting, queue: S.outbox.length, counting: updCounting(), hidden: document.visibilityState === "hidden", station: S.station }) === "reload") updApply();
}
function updApply() {
  var w = UPD.reg && UPD.reg.waiting;
  if (!w || UPD.applying) return;
  UPD.applying = true;
  navigator.serviceWorker.addEventListener("controllerchange", function () { location.reload(); });
  w.postMessage({ type: "skip" });
}
function updFetch() {
  if (!UPD.reg) return;
  fetch("version.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (j && j.v && j.v !== BUILD && !UPD.reg.waiting) return UPD.reg.update();
  }).then(updCheck, function () {});
}
ACT.newVer = function () {
  if (!S.outbox.length && !updCounting()) return updApply();
  toast(S.outbox.length ? outboxCount() + " waiting to upload" : "Finish the count first");
};
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") updFetch(); else updCheck(); });
// the app version: a long press on the logo
var LOGO_T = null;
document.addEventListener("pointerdown", function (e) {
  if (!e.target.closest || !e.target.closest(".brand .logo")) return;
  clearTimeout(LOGO_T);
  LOGO_T = setTimeout(function () { toast("App " + VERSION + " · " + BUILD, 5000); }, 600);
});
["pointerup", "pointercancel"].forEach(function (t) { document.addEventListener(t, function () { clearTimeout(LOGO_T); }); });

/* ---------- start ---------- */
(function boot() {
  var st = document.createElement("style");
  st.textContent = C.SLIP_CSS;
  document.head.appendChild(st);
  if (S.station) document.title = "Orion Print Station";
  if (S.view === "count" && !S.count) S.view = null;
  S.count = S.count || LS.get("count", null);
  // lab entries older than 70 days leave the iPad, except what the stock rules still need (9.5d)
  var labKeep = C.labPrune(values(S.labs));
  if (labKeep.length < Object.keys(S.labs).length) { Object.keys(S.labs).forEach(function (k) { if (labKeep.indexOf(S.labs[k]) < 0) delete S.labs[k]; }); persist("labs"); }
  render();
  // the save queue: read from IndexedDB (moving an older localStorage queue in once), then sent
  loadOutbox().then(function () { QDB.done = true; flushOutbox(); softRender(); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (p) { LS.set("persisted", !!p); }, function () {});
  if (S.station) { startStation(); }
  else {
    if (S.key) { lastFull = lastOrders = Date.now(); syncAll(); }
    setInterval(function () { autoSync("timer"); }, 60000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") autoSync("open"); });
  }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").then(function (reg) {
    UPD.reg = reg;
    reg.addEventListener("updatefound", function () {
      var n = reg.installing;
      if (n) n.addEventListener("statechange", updCheck);   // installed: waiting; activated / redundant: not
    });
    updCheck(); updFetch();
  }).catch(function () {});
  // test hook (only with ?debug=1 in the address)
  if (/[?&]debug=1\b/.test(location.search)) window.__ow = { S: S, ST: ST, toast: toast, photoSheet: photoSheet, get SET() { return SET; }, get CAT() { return CAT; }, syncAll: syncAll, flushOutbox: flushOutbox, printNew: printNew, autoSync: autoSync, stock: stock, saveLog: saveLog, UPD: UPD, updApply: updApply, updCheck: updCheck, ordersState: ordersState, render: render,
    ui: { chip: uiChip, row: uiRow, progress: uiProgress, primary: uiPrimary, secondary: uiSecondary, empty: uiEmpty, qbadge: uiQueueBadge, seg: uiSeg, appBar: uiAppBar, tabBar: uiTabBar, field: uiField, keypad: uiKeypad, scan: uiScan, rail: uiRail, toastUndo: toastUndo, openSheet: openSheet } };
})();

})();
</script>
