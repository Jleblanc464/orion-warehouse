<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion Warehouse</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D50032">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warehouse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
/* Orion Warehouse — layout: one column of work, a sticky bar with the next action.
   Orion red (PANTONE 199 C, #D50032) carries the brand band, the active tab, section labels and the main actions;
   bin-label chips carry the rack/shelf.
   3 Oct, from John's design system (Modernist), the three patterns he picked: flat surfaces with strong 2px rules under
   section labels and table headers (no drop shadows on cards, order tiles or buttons: lighter for the iPad to scroll),
   the chosen option in a toggle shown as a solid red block, and small red text in --accent, the red that reads on black
   (fills, the band and buttons stay PANTONE 199 C). */
:root{
  color-scheme:dark;
  --bg:#0B0F15; --surface:#141A23; --sunk:#10151C; --line:#253041; --line-2:#334155;
  --ink:#EEF2F7; --ink-2:#C7D0DC; --ink-3:#94A1B2; --ink-4:#7D8A9C;   /* ink-4: 5:1 on the cards (was 3.9:1) */
  --accent:#FF3B62; --accent-ink:#16050A; --accent-soft:#3A1220;
  --brand:#D50032; --brand-deep:#A8002A; --brand-ink:#FFFFFF; --brand-soft:#3A1220;
  --ok:#3DD68C; --ok-bg:#0E2A1E; --ok-ink:#06281A; --warn:#F5A524; --warn-bg:#2B1F08; --bad:#F97066; --bad-bg:#2C1312;
  --chip:#E9EEF5; --chip-ink:#0F151D; --focus:#60A5FA;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px -12px rgba(0,0,0,.7);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}
/* John, 3 Oct: "look better with the black backround" - dark always; light kept for data-theme="light" (the demo's own switch) */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F6F8; --line:#DCE1E7; --line-2:#C5CCD6;
  --ink:#10151D; --ink-2:#36404D; --ink-3:#5F6B7A; --ink-4:#8B96A5;
  --accent:#D50032; --accent-ink:#FFFFFF; --accent-soft:#FCE7EC;
  --brand:#D50032; --brand-deep:#A8002A; --brand-ink:#FFFFFF; --brand-soft:#FCE7EC;
  --ok:#0D7A4E; --ok-bg:#E5F5EC; --ok-ink:#FFFFFF; --warn:#A35400; --warn-bg:#FFF2E0; --bad:#B42318; --bad-bg:#FDECEA;
  --chip:#1B2430; --chip-ink:#F4F6F9; --focus:#2563EB;
  --shadow:0 1px 2px rgba(16,21,29,.06),0 6px 18px -10px rgba(16,21,29,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--ink-3)} .dim{color:var(--ink-4)} .mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app frame ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.band{background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:var(--brand-ink)}
.brand .logo{display:flex;align-items:center}
.brand .logo-svg{height:38px;width:auto;display:block}
.brand .app{font-size:18px;font-weight:650;white-space:nowrap;padding-left:12px;border-left:1px solid rgba(255,255,255,.5);line-height:24px;letter-spacing:.01em}
.bar .grow{flex:1}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.off i{background:var(--ink-4)} .sync.bad i{background:var(--bad)} .sync.busy i{background:var(--warn)}
.band .sync{color:var(--brand-ink);background:rgba(0,0,0,.16);padding:6px 12px;border-radius:999px;font-weight:600}
.band .sync i{background:#8EF2C0;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.band .sync.off i{background:rgba(255,255,255,.6)} .band .sync.busy i{background:#FFD166} .band .sync.bad i{background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.band .btn{background:#fff;color:var(--brand);border-color:#fff}
.band .btn:active{background:#FFE3EA}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:12px 14px 11px;font-size:15px;font-weight:600;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--brand)}
.tabs .n{font-size:12px;font-weight:700;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--brand);color:var(--brand-ink);text-align:center}
.tabs .n.z{background:var(--sunk);color:var(--ink-4)}
.tabs .n.warn{background:var(--warn);color:#2B1F08}   /* the Stock tab's expiring count: amber, a warning rather than work waiting */
/* phones: the red band keeps the logo, the status and Refresh (the screen name drops; long status text shortens) */
@media (max-width:600px){
  .bar{gap:10px;padding:8px 12px}
  .brand{flex:none}
  .brand .app{display:none}
  .band .sync{min-width:0;overflow:hidden}
  .band .sync span{min-width:0;overflow:hidden;text-overflow:ellipsis}
}
main{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);margin-bottom:14px;font-size:15px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.banner .grow{flex:1;min-width:200px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:active{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.big{min-height:56px;font-size:17px;padding:0 22px;border-radius:12px}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.link{border:0;background:none;font-size:14px;font-weight:600;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 6px;margin:-8px -6px}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=password],input[type=date],input[type=datetime-local],select,textarea{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:16px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:2px;gap:2px}
.seg button{border:0;background:none;min-height:44px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button[aria-pressed="true"]:active{background:var(--brand-deep)}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card + .card{margin-top:12px}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{font-size:18px}
.cb{padding:14px 16px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.head h1{font-size:26px;display:flex;align-items:center;gap:10px}
.head h1::before{content:"";flex:none;width:5px;height:24px;border-radius:3px;background:var(--brand)}
.card.setup{border-top:4px solid var(--brand)}
.head .sub{color:var(--ink-3);font-size:14px;margin-top:2px}
.head .grow{flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);line-height:1.6}
.empty b{color:var(--ink);display:block;font-size:18px;margin-bottom:4px}

/* order queue */
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.qsearch{margin:0 0 14px}
.qsearch input{max-width:560px}
.qhead{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:2px 2px 8px;border-bottom:2px solid var(--line-2);margin-bottom:12px}
.ocard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);border-top:3px solid var(--brand);background:var(--surface);min-height:132px;position:relative;overflow:hidden}
.ocard:active{transform:translateY(1px);background:var(--sunk)}
.ocard.stat{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));border-top-color:var(--brand);background:color-mix(in srgb,var(--brand-soft) 60%,var(--surface))}
.ocard.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand)}
.ocard .t{font-size:17px;font-weight:700;line-height:1.25}
.ocard .m{font-size:13px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.ocard .m .mono{color:var(--accent);font-weight:700}
.ocard .c{font-size:13.5px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:6px 9px}
.ocard .c span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ocard .f{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.pill.red{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.loc{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.02em;background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:4px 7px;min-width:68px;text-align:center;line-height:1.2;white-space:nowrap}
.loc .lp{white-space:nowrap}   /* a two-place chip ("R3B3S1 (R) / R3B3S2") wraps at the " / " when it has to (6 Oct: the Stock list fits at 810 wide) */
.loc.two{white-space:normal;flex-wrap:wrap;column-gap:4px;max-width:150px}
.lines .line > .loc,.res > .loc{width:118px;max-width:118px}   /* one chip width down a list, so the names line up */
.loc.none{background:var(--sunk);color:var(--ink-4);border:1px dashed var(--line-2)}

/* ---------- packing screen ---------- */
.packhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;margin-bottom:12px}
.packhead h1{font-size:24px;line-height:1.2}
.packhead .addr{font-size:14.5px;color:var(--ink-2);margin-top:4px}
.packhead .meta{font-size:13px;color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:600px){.packhead{grid-template-columns:minmax(0,1fr)}}
.cmts{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.cmts .q{font-size:15px;white-space:pre-wrap;line-height:1.5}
.cmts .lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.sugs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sug{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sug .what{flex:1;min-width:200px;font-size:14.5px}
.sug .what small{display:block;color:var(--ink-3);font-size:12.5px}
.sug.added{opacity:.55}
.lines{display:flex;flex-direction:column}
.zone{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:14px 4px 6px;border-bottom:2px solid var(--line-2);margin-bottom:8px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.line.picked{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok-bg) 55%,var(--surface))}
.line.short{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:color-mix(in srgb,var(--warn-bg) 60%,var(--surface))}
.line .nm{font-size:16px;font-weight:650;line-height:1.25}
.line .sub2{font-size:13px;color:var(--ink-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.line .sub2 .lowstock{color:var(--bad);font-weight:700}
.line .ord{text-align:right;font-size:13px;color:var(--ink-3);line-height:1.25;min-width:72px}
.line .ord b{display:block;font-size:20px;color:var(--ink)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:24px;font-weight:600;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none;display:inline-flex;align-items:center;justify-content:center}
.step input{width:84px;height:48px;text-align:center;font-size:20px;font-weight:700;border-radius:12px;padding:4px}
.step .ok{width:auto;padding:0 14px;font-size:15px;border-color:var(--ok);color:var(--ok)}
.line.picked .step .ok{background:var(--ok);color:var(--ok-ink)}
.shortnote{grid-column:2 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.shortnote select{max-width:300px;min-height:44px;font-size:16px;padding:4px 10px}
@media (max-width:720px){
  .line{grid-template-columns:auto minmax(0,1fr)}
  .line .ord{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}
  .line .ord b{display:inline;font-size:17px}
  .line .step{grid-column:1 / -1}
  .shortnote{grid-column:1 / -1}
}
.btn.back{padding-left:4px;padding-right:10px}
.btn.ghost.danger{border-color:transparent;padding-left:4px}
.addline{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:2px;border:1.5px dashed var(--line-2);border-radius:12px;background:transparent;color:var(--ink-2);font-weight:600;font-size:15px;touch-action:manipulation}
.addline:active{background:var(--sunk)}
.packfoot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:3px solid var(--brand);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.packfoot .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.packfoot .prog{font-size:14px;color:var(--ink-3);min-width:150px}
.packfoot .prog b{color:var(--ink);font-size:17px}
.packfoot .boxes{display:flex;align-items:center;gap:8px;font-weight:600}
.packfoot .boxes button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:24px;display:inline-flex;align-items:center;justify-content:center}
.packfoot .boxes span{min-width:28px;text-align:center;font-size:20px;font-weight:700}
.packfoot select{width:auto;min-width:150px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line-2);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right;white-space:nowrap}
table.t tr.click{cursor:pointer;height:48px}
table.t tr.sec td{background:var(--sunk);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:8px 12px;border-bottom:2px solid var(--line-2)}
table.t input{min-height:44px;padding:6px 10px}
table.t input[type=number]{width:110px;text-align:right}
.zero{color:var(--bad);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:var(--r);padding:10px 14px}
.kpi .k{font-size:12.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:24px;font-weight:750;margin-top:2px;letter-spacing:-.02em}
.ch .tsearch{width:auto;flex:1 1 170px;max-width:320px;min-width:150px}
table.t .sub2{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400;margin-top:2px}

/* ---------- sheets (modals) ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,16,.48);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;border-top:4px solid var(--brand);box-shadow:0 20px 60px -20px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet.wide{max-width:920px}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet .sh h2{font-size:19px;flex:1}
.sheet .sb{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sheet .sb > *{flex-shrink:0}
.sheet .sf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.results{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.res{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.res .nm{flex:1;min-width:0;font-weight:600}
.res .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.preview{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:18px;overflow:auto}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.big-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 0}
.big-ok .mark{width:64px;height:64px;border-radius:50%;background:var(--ok);color:var(--ok-ink);display:grid;place-items:center;font-size:34px;font-weight:800}
.big-ok h3{font-size:22px}

/* ---------- print station ---------- */
.station{max-width:980px;margin:0 auto}
.station .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;padding:22px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand)}
.station .dot{width:22px;height:22px;margin-top:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 8px color-mix(in srgb,var(--ok) 18%,transparent)}
.station .dot.paused{background:var(--warn);box-shadow:0 0 0 8px color-mix(in srgb,var(--warn) 18%,transparent)}
.station .dot.err{background:var(--bad);box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 18%,transparent)}
.station h1{font-size:28px}
.station .meta{color:var(--ink-3);margin-top:4px}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{size:letter;margin:0}
  html,body{background:#fff!important;min-height:0!important}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0 0.5in;color:#000}
  .pwrap{width:100%;border-collapse:collapse}
  .pwrap > thead > tr > td,.pwrap > tbody > tr > td,.pwrap > tfoot > tr > td{padding:0;border:0}
  .pwrap .pgap{height:0.42in}
  .pwrap + .pwrap{break-before:page}
}
.preview .pslip{max-width:none}
@media (prefers-reduced-motion:no-preference){
  .btn,.ocard,.line,.res{transition:background-color .12s,border-color .12s,transform .08s}
}
/* Settings: which sites get the packed email */
details.sites{border:1px solid var(--line);border-radius:var(--r);padding:0 14px;background:var(--sunk)}
details.sites[open]{padding-bottom:12px}
details.sites summary{cursor:pointer;font-weight:600;font-size:15px}
details.sites .sitelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
details.sites .sitelist span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* ---------- touch screen (the iPad) ----------
   no double-tap zoom on anything you tap (pinch zoom still works), no grey flash: controls show their own pressed look
   (app5 adds a touchstart listener so Safari applies :active), no text selection or callout when a finger rests on a control */
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,a,input,select,textarea,label,summary,[data-act],.tabs,.tw,.results,.sheet .sb{touch-action:manipulation}
button,summary,.ocard,.res,.loc,.pill,table.t tr.click{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
summary{cursor:pointer;padding:11px 0}
.step button:active,.packfoot .boxes button:active{background:var(--sunk);transform:scale(.95)}
.line.picked .step .ok:active,.step .ok:active{filter:brightness(.9)}
.seg button:active,.tabs button:active,.res:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}
table.t tr.click:active td{background:var(--sunk)}
.link:active{color:var(--ink)}
/* choices in sheets (why it's removed, why it's adjusted, hide an item): the whole row is the tap target */
label.opt{display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;cursor:pointer}
label.opt input[type=radio],label.opt input[type=checkbox]{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand)}
/* a tap on the dimmed backdrop closes a sheet (Safari only sends taps to elements that look clickable); the sheet scrolls on its own */
.scrim{cursor:pointer}
.sheet{cursor:auto}
.sheet .sb,.results{overscroll-behavior:contain}
@media (any-pointer:coarse){body:has(> #sheet:not([hidden])){overflow:hidden}}
/* while the on-screen keyboard is up, the bottom bar steps aside so it can't sit over the field being typed in */
html.kb .packfoot{display:none}
/* late orders (warehouse days waiting, C.waitDays): amber after one day, red after two, so nothing slips past the 3-day
   delivery; STAT keeps its own look */
.ocard.age1{border-color:color-mix(in srgb,var(--warn) 65%,var(--line));border-top-color:var(--warn);box-shadow:0 0 0 1px color-mix(in srgb,var(--warn) 65%,transparent)}
.ocard.age2{border-color:var(--bad);border-top-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.pill.age{border-color:transparent;color:var(--surface)}
.pill.age.a1{background:var(--warn)}
.pill.age.a2{background:var(--bad)}
.head .sub .late{color:var(--bad)}

/* ---------- expiration dates and the packing slip scan (5 Oct) ---------- */
.nowrap{white-space:nowrap}
.exprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exprow .lab{font-size:13px;font-weight:700;color:var(--ink-3)}
.exprow .btn{margin-left:auto}
.line .sub2 .pill{padding:1px 7px;align-self:center}
.addrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.addrow{grid-template-columns:minmax(0,1fr)}}
.addline[disabled]{opacity:.55}
.cmts.scan{border-color:color-mix(in srgb,var(--accent) 28%,var(--line));background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.cmts.scan .lab{color:var(--accent)}
.cmts.scan .q{font-size:14.5px;white-space:normal}
/* item and stock numbers under an item (Stock, Count, Receive, the item picker; John, 5 Oct) */
.nums{font-size:12.5px;color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
table.t small.nums,.res .nm small.nums,.sug .what small.nums{display:block}
/* 5 Oct: the ship-to from the location list, quantities that look off, the location list in Settings */
.locbox{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.locbox .lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.locbox p{margin:0;font-size:15px}
.locbox.insheet{margin:0}
.locsug{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.locsug .nm{font-weight:700;font-size:15px}
.locsug .ad{font-size:13px;color:var(--ink-3)}
.locok{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ok);margin:-4px 0 12px}
.locok span{flex:1;min-width:200px}
/* the quiet note on a packing line (John, 6 Oct: a friendly heads-up, never a nag): plain words, one tap to answer, no alarm colours */
.line .note{grid-column:2 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2);background:var(--sunk);border:1px solid var(--line-2);border-left:3px solid var(--ink-4);border-radius:10px;padding:8px 10px}
.line .note span{flex:1;min-width:220px}
.line .note.done{color:var(--ok);border-left-color:var(--ok)}
.qtywas{grid-column:2 / -1;font-size:12.5px;color:var(--ink-3)}
@media (max-width:720px){ .line .note,.qtywas{grid-column:1 / -1} }
.sheet .sf .grow{flex:1}
.locbox .row .link,.sheet .row .link{margin:0}
.bigrow .pill{align-self:center}
/* the slip without an order: the ship-to part (list search, picked, typed in) */
.blship{display:flex;flex-direction:column;gap:12px}
.blship .f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.locsug.picked{cursor:default}
.bigrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.bigrow .what{flex:1;min-width:200px}
.bigrow .what small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.locset{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}

/* 5 Oct: the location written out (Row 5, Bay 4, Shelves 1-3) under the item's chips and under the Bin location field */
.locfull{margin:2px 0 0;color:var(--ink-2);font-size:14px;font-weight:500}
label.f .locfull{display:block;min-height:18px;font-size:13.5px;color:var(--ink-3)}
label.f .locfull:empty{min-height:0}   /* no blank gap under Bin location before anything is typed */
.sheet .sb > .seg{align-self:flex-start}   /* Take out / Add at its own width, not stretched across the sheet */
details.more summary,details.sites summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
details.more summary::-webkit-details-marker,details.sites summary::-webkit-details-marker{display:none}
details.more summary::before,details.sites summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .12s;flex:none;margin:0 2px}
details.more[open] summary::before,details.sites[open] summary::before{transform:rotate(45deg)}

/* 6 Oct: bin capacity (Jackson's bin counts) on the item sheet, and the count screens' Full bins helper */
.bincap{margin:2px 0 0;color:var(--ink-2);font-size:14px;font-weight:500}
.bincap b{font-weight:700;color:var(--ink)}
.stepcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.binhelp{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.binsum{font-size:14px;font-weight:650;color:var(--ink);max-width:330px;text-align:right}
.binsum:empty{display:none}
.sheet .binhelp{align-items:flex-start}
.sheet .binsum{text-align:left;max-width:none}
.binstep .binlab{display:flex;flex-direction:column;align-items:flex-end;font-size:14px;font-weight:650;color:var(--ink-2);line-height:1.2;margin-right:4px}
.binstep .binlab small{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.binstep input{width:64px}
.sheet .binstep .binlab{align-items:flex-start;min-width:110px}
@media (max-width:720px){ .line .stepcol{grid-column:1 / -1;align-items:flex-start} .line .binhelp{align-items:flex-start} .line .binsum{text-align:left;max-width:none} .line .binstep .binlab{align-items:flex-start;min-width:110px} }

/* ---------- 6 Oct: receiving as a checklist, counting one shelf spot at a time (John's redesign) ---------- */
/* the one big action on an empty Receive screen */
.photobtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:120px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:21px;touch-action:manipulation}
.photobtn:active{background:var(--brand-deep)}
.photobtn svg{width:40px;height:40px}
.photobtn small{font-size:14px;font-weight:500;opacity:.9}
/* lines left (receiving) / spot progress (counting), at the top */
.left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px;font-size:15px;color:var(--ink-2)}
.left b{font-size:22px;color:var(--ink)}
.left .pages{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.progbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:1 1 160px;min-width:120px}
.progbar i{display:block;height:100%;background:var(--ok)}
/* the Needs a look group, the quiet notes under a line */
.zone.needs{color:var(--warn);border-bottom-color:color-mix(in srgb,var(--warn) 55%,var(--line-2))}
.line .why{grid-column:2 / -1;font-size:14px;color:var(--ink-2);background:var(--sunk);border:1px solid var(--line-2);border-left:3px solid var(--warn);border-radius:10px;padding:8px 10px}
.line .why.ok{border-left-color:var(--ok)}
.line .why small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.line .qty{font-size:15px;color:var(--ink-2);margin-top:3px}
.line .qty b{color:var(--ink);font-size:17px}
.line .exp{font-size:13.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* the two taps on a checklist line: Arrived as listed (one tap), Change; on a count line: Matches / Done */
.chkbtns{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.chkbtns .ok,.matches{min-height:52px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ok);background:transparent;color:var(--ok);font-weight:700;font-size:16px;white-space:nowrap;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.line.picked .chkbtns .ok,.line.picked .matches{background:var(--ok);color:var(--ok-ink)}
.chkbtns .ok:active,.matches:active{filter:brightness(.9)}
.chkbtns .btn{min-height:52px}
.line.unmatched .nm{font-family:var(--mono);font-size:15px;color:var(--ink-2)}
.line .chkbtns.wide{grid-column:1 / -1;justify-content:flex-start}
@media (max-width:720px){ .line .chkbtns{grid-column:1 / -1;justify-content:flex-start} .line .why{grid-column:1 / -1} }
.packfoot .btn.ok{border-color:var(--ok);color:var(--ok)}
.packfoot .btn{min-height:52px}
/* the Change editor: the value with − / +, a number pad, the reasons */
.padval{display:flex;align-items:center;gap:10px;justify-content:center}
.padval button{width:64px;height:64px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:30px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.padval button:active{background:var(--sunk);transform:scale(.95)}
.padval .v{min-width:150px;text-align:center;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.padval .v small{display:block;font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.padeach{text-align:center;color:var(--ink-2);font-size:15px;min-height:22px}
.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.numpad button{min-height:60px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:24px;font-weight:600;touch-action:manipulation}
.numpad button:active{background:var(--sunk)}
.numpad button.k{background:var(--sunk);font-size:18px}
.reasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.reasons button{min-height:52px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:650;font-size:15px;touch-action:manipulation}
.reasons button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
@media (max-width:520px){.reasons{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* the photo check, the reading progress, the pasted text */
.photochk{display:flex;flex-direction:column;align-items:center;gap:10px}
.fakephoto{max-width:300px;max-height:380px;border-radius:10px;background:#1c1c1c;display:block}
.photochk p{margin:0;font-size:16px;text-align:center;max-width:460px}
.reading{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink-2);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.reading.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.reading .progbar{flex:1}
.reading .progbar i{background:var(--brand)}
.pastebox{min-height:220px;font-family:var(--mono);font-size:16px;line-height:1.45}   /* 16 px: Safari doesn't zoom */
.livetext{margin:0;font-size:14px;color:var(--ink-3)}
.livetext b{color:var(--ink-2)}
/* counting: the row jump bar, the spot card, the entry box */
.rowjump{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.rowjump button{min-width:52px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;touch-action:manipulation}
.rowjump button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.rowjump button.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line-2))}
.rowjump button.skip{color:var(--warn)}
.spot{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);margin-bottom:12px}
.spot .code{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.02em;background:var(--chip);color:var(--chip-ink);border-radius:10px;padding:6px 14px}
.spot .words{font-size:22px;font-weight:700;line-height:1.2;min-width:0;flex:1}
.spot .words small{display:block;font-size:14px;font-weight:500;color:var(--ink-3);margin-top:2px}
.spot .skipword{color:var(--warn)}
.cnt{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.cnt .crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cnt .clab{min-width:150px;font-size:14px;font-weight:650;color:var(--ink-2);line-height:1.2}
.cnt .clab small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.cnt .step input{width:96px}
.cnt .step .plus{font-weight:700;color:var(--ink-3);padding:0 2px}
.cnt .binhelp{align-items:flex-start}
.cnt .binstep .binlab{align-items:flex-start;min-width:150px}
.cnt .sum{font-size:16px;font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:8px}
.cnt .sum:empty{display:none}
.sheet .cnt{margin:0}
.line .ord{min-width:96px}
.cntfoot .skip{color:var(--warn)}
.diff.up{color:var(--ok);font-weight:700} .diff.down{color:var(--bad);font-weight:700}
.againbig{font-size:28px;font-weight:800;text-align:center;margin:4px 0}
.againbig small{display:block;font-size:15px;font-weight:500;color:var(--ink-3)}

<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="printArea"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script>
/* Orion Warehouse — item catalog
   One row per stocked item. Stock is kept in single pieces ("each"), the same unit
   as the warehouse count sheet. The packing slip unit is what Jackson counts out
   when he packs (a pack of 100 tiger tops is 1 "PK/100").

   Fields
     id   stable id (matches the Stock Control dashboard where the item exists there)
     n    name as printed on the packing slip
     s    section
     l    warehouse location, Jackson's naming (5 Oct 2026): R<row>B<bay>S<shelf>, e.g. R5B4S123 = row 5, bay 4, shelves 1-3;
          (L) (M) (R) = the left / middle / right bin; "Back / ...", "Mid / ..." off the racks; "" = not known yet.
          Kept in data/warehouse_layout.json (tools/warehouse_layout.py) and written here by tools/apply_layout.js
     b    Jackson's bin count (2 Oct 2026): [per bin, bin unit, bins], e.g. [15,"Box of 100",12]; written by tools/apply_layout.js.
          core.binInfo gives the bin capacity where the bin unit is clear
     u    packing-slip unit label
     p    pieces in one packing-slip unit (stock is kept in pieces)
     k    pieces in a box/pack when a site writes "1 box" in comments (EACH items)
     c    pieces in a case, where known
     of   Order Supplies field ("Section_Field") and op = pieces per unit on that field
     x    names used on the warehouse count spreadsheet (for Excel import)
     v    vendor, vi vendor item # (from the count spreadsheet)
     syn  words a site uses in the comments box for this item
     no   words that rule this item out (e.g. "extra small" for small gloves)
     slip 1 = on the paper packing slip; 0 = stocked but not on the paper slip
     cf   1 = pack size still to confirm
     vn   numbers that identify the item on a vendor's packing slip (vendor #, maker's #, distributor catalog #)
     vu   pieces in one vendor unit as printed on packing slips: CS case, BX box, PK pack, BG bag, KT kit
          (from McKesson / Medline / Fisher invoice lines and the 9/25 warehouse count; used to read a photo of a packing slip)
     sn   stock number: the package's GTIN barcode number (John's online inventory sheet, 5 Oct)

   Items with no "of" aren't on the Order Supplies form (sites can't order them there; they still match in the comments box).
   5 Oct (John's answers to Jackson's layout): new warehouse items, stocked, counted and received but not on the form or the
   paper slip (slip 0): the three PSC Labcorp boxes, the light green PST tube (Jackson's "teal tubes"), pediatric urine
   collectors, Microtainer contact lancets, Clinitest kits, extra small and extra large gloves. Two duplicates were merged:
   COL-SALIVETTE into COL-SALIVARY and COL-POLYMEDCO into COL-COLOFIT (their names and numbers are kept on the item; the old
   ids still read as the kept item in history: core ID_ALIAS).
*/
var CATALOG = [

Object.keys(S.slips).forEach(function (k) { S.slips[k] = C.aliasSlip(S.slips[k]); });
Object.keys(S.logs).forEach(function (k) { S.logs[k] = C.aliasLog(S.logs[k]); });

var CAT = C.buildCatalog(SET);

function cut(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1).replace(/[\s,.\-–(]+$/, "") + "…" : s; }

function esc(s) { return C.esc(s); }

function locChip(l) {

  var parts = String(l).split(" / "), txt = parts.length > 1 ? parts.map(function (x, k) { return '<span class="lp">' + esc(x) + (k < parts.length - 1 ? " /" : "") + "</span>"; }).join(" ") : esc(l);

  if (k === "slips" || !k) ok = LS.set("slips", S.slips) && ok;

  entry: function (form, n) { return API.req("GET", "/forms/" + form + "/entries/" + n); },
  create: function (form, body) { return API.req("POST", "/forms/" + form + "/entries", body, 45000); },

function errText(e) {
  if (!e) return "Something went wrong.";
  if (e.status === 401) return S.station ? "Cognito refused the API key. Use Change API key to enter the new one." :
    "Cognito refused this iPad’s API key, so nothing can upload or update. If the key was changed in Cognito: Settings → Disconnect, then connect with the new key. Disconnect says first if anything on this iPad hasn’t uploaded (it would be lost).";
  if (e.status === 403) return "The API key can't reach this form. Check the key's form access in Cognito.";

  if (e && (e.status === 401 || e.status === 403 || e.status === 429)) return errText(e);

  var tip = !st && inSafariTab() ? '<div class="banner warn" style="margin:0"><div class="grow"><b>Add this page to the Home Screen first.</b> Tap Share (the square with an arrow; if you don’t see it, tap ••• first), then <b>Add to Home Screen</b> → <b>Add</b>. Open <b>Warehouse</b> from the Home Screen and connect there: the icon keeps its own settings, separate from Safari.</div></div>' : "";
  return '<div class="card setup" style="max-width:620px;margin:24px auto"><div class="ch"><h2>' + (st ? "Connect the print station" : "Connect this iPad") + '</h2></div><div class="cb" style="display:flex;flex-direction:column;gap:14px">' + tip +
    '<p class="muted" style="margin:0">Paste the Cognito API key for the warehouse app. It is stored only on this ' + (st ? "computer, in this window" : "iPad") + ".</p>" +

    '<div class="grid2"><label class="f">Name for this ' + (st ? "computer" : "iPad") + '<input id="sDev" type="text" value="' + esc(S.device || (st ? "Print station" : "Warehouse iPad")) + '"></label>' +

    '<div class="row"><button class="btn primary big" data-act="connect">Connect</button><span id="sMsg" class="muted" role="status"></span></div>' +
    (st ? "" : '<p class="muted" style="margin:0;font-size:14px">Setting up the Windows computer next to the printer? <button class="btn ghost sm" data-act="stationHelp" style="padding:0 4px">Set up the print station</button></p>') +
    "</div></div>";
}
ACT.connect = function () {
  var key = ($("#sKey").value || "").trim(), dev = ($("#sDev").value || "").trim(), packer = $("#sPacker") ? ($("#sPacker").value || "").trim() : S.packer;
  var msg = $("#sMsg");
  if (key.length < 40) { msg.textContent = "That doesn't look like a full API key."; return; }
  msg.textContent = "Checking the key…";
  var old = S.key; S.key = key;
  API.forms().then(function (forms) {
    var ids = (forms || []).map(function (f) { return String(f.Id); });
    var need = [CFG.forms.orders, CFG.forms.slips, CFG.forms.log, CFG.forms.settings];
    var missing = need.filter(function (id) { return ids.indexOf(id) < 0; });
    if (missing.length) { S.key = old; msg.textContent = "The key works, but it can't see form(s) " + missing.join(", ") + ". In Cognito, give the key access to the Warehouse folder and Order Supplies."; return; }
    LS.set("key", key); S.device = dev || (S.station ? "Print station" : "Warehouse iPad"); LS.set("device", S.device); S.packer = packer || ""; LS.set("packer", S.packer);
    toast("Connected to Cognito");
    if (S.station) startStation(); else { render(); syncAll(); }
  }, function (e) { S.key = old; msg.textContent = e && e.status === 401 ? "Cognito refused this API key. Check it and try again." : errText(e); });
};

/* ---------- order queue ---------- */
var QS = { q: "" };   // the search box on To pack
// warehouse days an order has waited (C.waitDays): amber after one, red after two
function orderWait(o) { return C.waitDays(o.when, Date.now(), SET.fastDays, SET.fastTo); }
function renderQueue() {
  var list = openOrders(), late = list.filter(function (o) { return orderWait(o) >= 2; }).length;
  var head = '<div class="head"><div><h1>To pack</h1><div class="sub">' + list.length + (list.length === 1 ? " order" : " orders") +
    " waiting · STAT first, then oldest first" + (late ? ' · <b class="late">' + late + (late === 1 ? " has" : " have") + " waited 2+ days</b>" : "") + "</div></div><div class='grow'></div>" +
    '<div class="row"><button class="btn" data-act="blankSlip">Slip without an order</button></div></div>' +
    '<div class="qsearch"><input type="search" id="qSearch" placeholder="Search by practice, order #, item or comment" value="' + esc(QS.q) + '" data-in="qQ" data-enter="qEnter" autocomplete="off" aria-label="Search orders"></div>';
  if (S.pack && !S.view) {
    head += '<div class="banner warn"><div class="grow"><b>Slip in progress:</b> ' + esc(S.pack.shipTo || "no ship-to") + (S.pack.order ? " · order #" + S.pack.order : "") + '</div><button class="btn sm primary" data-act="resumePack">Continue packing</button><button class="btn sm" data-act="discardDraft">Discard</button></div>';
  }
  return head + '<div id="qList">' + queueBody() + "</div>";
}
function orderCard(o) {
  var n = o.lines.length, w = orderWait(o), age = w >= 2 ? 2 : w;
  return '<button class="ocard' + (o.stat ? " stat" : "") + (age ? " age" + age : "") + '" data-act="openOrder" data-num="' + o.num + '">' +
    '<div class="t">' + esc(shipName(o) || "(no practice name)") + "</div>" +
    '<div class="m"><span class="mono">#' + o.num + '</span><span title="' + esc(when(o.when)) + '">ordered ' + esc(C.orderDayText(o.when)) + "</span></div>" +
    (o.comments ? '<div class="c"><span>' + esc(o.comments) + "</span></div>" : "") +
    '<div class="f">' + (o.stat ? '<span class="pill red">STAT</span>' : "") + (age ? '<span class="pill age a' + age + '">Waiting ' + w + (w === 1 ? " day" : " days") + "</span>" : "") +
    (n ? '<span class="pill">' + n + (n === 1 ? " item" : " items") + "</span>" : "") +
    (o.comments ? '<span class="pill warn">' + (n ? "Comments" : "Comments only") + "</span>" : "") + "</div></button>";
}
// every word typed must appear somewhere in the order: number, practice, contact, address, email, comments or item names
function orderMatches(o, words) {
  var hay = ("#" + o.num + " " + o.practice + " " + o.contact + " " + o.address + " " + o.email + " " + o.comments + " " +
    o.lines.map(function (l) { var it = itemOf(l.id); return it ? it.n : ""; }).join(" ")).toLowerCase();
  return words.every(function (w) { return hay.indexOf(w) >= 0; });
}
function orderStatus(o, st, start) {
  var slips = st.byOrder[o.num] || [], packed = slips.filter(function (s) { return s.type === "Packed"; });
  if (packed.length) { var s = packed[packed.length - 1]; return '<span class="pill ok">Packed</span> ' + (s.num ? "slip #" + s.num : "uploading") + (s.shipDate ? " · " + esc(C.fmtDate(s.shipDate)) : ""); }
  if (slips.length) return '<span class="pill">Removed from queue</span>';
  if (o.status === "Complete") return '<span class="pill">Marked Complete in Cognito</span>';
  if (o.num < start) return '<span class="pill">Before #' + esc(start) + ", not in the queue</span>";
  return '<span class="pill warn">Waiting</span>';
}
function queueBody() {
  var list = openOrders(), raw = (QS.q || "").trim(), words = raw.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) {
    if (!list.length) return '<div class="card"><div class="empty"><b>Nothing to pack right now</b>New Order Supplies entries from #' + esc(SET.ordersStart) +
      " on show up here by themselves, checked every 15 minutes during warehouse hours (" + esc(hoursText()) + "). Tap Refresh (top right) to check right now. To pack an older order, search for its number.</div></div>";
    return '<div class="olist">' + list.map(orderCard).join("") + "</div>";
  }
  var openNum = {}; list.forEach(function (o) { openNum[o.num] = 1; });
  var hits = list.filter(function (o) { return orderMatches(o, words); });
  var st = ordersState(), start = SET.ordersStart || 0;
  var others = values(S.orders).filter(function (o) { return !openNum[o.num] && orderMatches(o, words); }).sort(function (a, b) { return b.num - a.num; }).slice(0, 40);
  var out = '<div class="qhead">Waiting to pack · ' + hits.length + "</div>" +
    (hits.length ? '<div class="olist">' + hits.map(orderCard).join("") + "</div>" : '<p class="muted" style="margin:0 2px 6px">No order waiting to pack matches “' + esc(raw) + "”.</p>");
  if (others.length) {
    out += '<div class="qhead" style="margin-top:18px">Other recent orders · ' + others.length + '</div><div class="card"><div class="tw"><table class="t"><thead><tr><th>Order</th><th>Practice</th><th>Ordered</th><th>Status</th></tr></thead><tbody>' +
      others.map(function (o) {
        return '<tr class="click" data-act="openOrder" data-num="' + o.num + '"><td class="mono">#' + o.num + "</td><td><b>" + esc(o.practice || "(no practice name)") + "</b></td><td>" + esc(when(o.when)) + "</td><td>" + orderStatus(o, st, start) + "</td></tr>";
      }).join("") + "</tbody></table></div></div>";
  }
  var num = /^#?\d{3,7}$/.test(raw) ? parseInt(raw.replace("#", ""), 10) : 0;
  if (num && !S.orders[num]) out += '<div class="row" style="margin-top:14px"><span class="muted">Order #' + num + " isn’t on this iPad.</span>" +
    '<button class="btn" data-act="findOrder" data-num="' + num + '">Look it up in Cognito</button></div>';
  return out;
}
IN.qQ = function (el) { QS.q = el.value; $("#qList").innerHTML = queueBody(); };
ACT.qEnter = function () {
  var raw = (QS.q || "").trim(), words = raw.toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return;
  var hits = openOrders().filter(function (o) { return orderMatches(o, words); });
  if (hits.length === 1) { openOrderSafely(hits[0]); return; }
  var num = /^#?\d{3,7}$/.test(raw) ? parseInt(raw.replace("#", ""), 10) : 0;
  if (num) lookUpOrder(num);
};
function openOrderSafely(o, force) {
  if (!o) return;
  if (S.pack && S.pack.order === o.num && !S.pack.follow) { ACT.resumePack(); return; }   // the slip already started for this order
  var st = ordersState();
  if (!force && st.byOrder[o.num]) {
    // a heads-up (John, 6 Oct): this order already has a slip, packed here or on another iPad; what it was, and how to fix a wrong one
    var all = st.byOrder[o.num], packed = all.filter(function (s) { return s.type === "Packed"; }), s = (packed.length ? packed : all)[(packed.length ? packed : all).length - 1];
    var nums = all.map(function (x) { return x.num ? "#" + x.num : "(uploading)"; }).join(", "), boxes = Math.max(1, Math.round(C.num(s.boxes) || 1));
    var who = (s.at ? " <b>" + esc(when(s.at)) + "</b>" : "") + (s.by ? " by <b>" + esc(s.by) + "</b>" : "") + (s.device ? (s.device === S.device ? " on <b>this iPad</b>" : " on <b>" + esc(s.device) + "</b>") : "");
    openSheet(packed.length ? "Order #" + o.num + " is already packed" : "Order #" + o.num + " was removed from the queue",
      (packed.length ? "<p style='margin:0'>Slip <b>" + esc(nums) + "</b> covers this order: packed" + who + ", " + boxes + (boxes === 1 ? " box" : " boxes") + ".</p>" +
        '<p class="muted" style="margin:0">Packing it again sends and prints a second slip. If the first one was wrong, void it in History instead and pack the order fresh.</p>' :
        "<p style='margin:0'>It was taken off the queue" + who + (s.notes ? " (" + esc(s.notes) + ")" : "") + ". Packing it now sends and prints a slip.</p>"),
      '<button class="btn" data-act="closeSheet">Back</button>' + (packed.length && s.num ? '<button class="btn" data-act="slipSheet" data-k="' + s.num + '">Open slip #' + s.num + "</button>" : "") +
      '<button class="btn primary" data-act="openOrderForce" data-num="' + o.num + '">' + (packed.length ? "Pack it again" : "Pack it") + "</button>");
    return;
  }
  confirmLeaveDraft(function () { startPack(o, {}); });
}
ACT.openOrder = function (el) { closeSheet(); openOrderSafely(S.orders[el.getAttribute("data-num")]); };
ACT.openOrderForce = function (el) { closeSheet(); openOrderSafely(S.orders[el.getAttribute("data-num")], true); };
ACT.resumePack = function () { closeSheet(); S.view = "pack"; render(); window.scrollTo(0, 0); };
ACT.discardDraft = function () { S.pack = null; LS.del("draft"); render(); };
ACT.findOrder = function (el) { lookUpOrder(parseInt(el.getAttribute("data-num"), 10)); };
function lookUpOrder(n) {
  if (!n) { toast("Type an order number first"); return; }
  if (S.orders[n]) { openOrderSafely(S.orders[n]); return; }
  toast("Looking up order #" + n + "…");
  API.entry(CFG.forms.orders, n).then(function (e) {
    upsert("orders", e); persist("orders");
    var o = S.orders[n];
    if (!o) { toast("Order #" + n + " isn't a submitted order"); return; }
    openOrderSafely(o);
  }, function (e) { toast(e.status === 404 ? "There is no order #" + n : errText(e), 4000); });
}

  if (b.mode === "picked") return '<div class="f"><span class="flab">Ship to</span><div class="locsug picked"><span class="nm">' + esc(b.pick.n) + '</span><span class="ad">' + esc(b.pick.a || "no address on the list") + "</span></div></div>" +
    '<div class="row"><span class="muted" style="font-size:13.5px">Name and address from the location list.</span><div class="grow"></div><button class="link" data-act="blankList">Change</button></div>';
  return '<label class="f">Ship to<input id="bShipQ" type="search" placeholder="Type part of the name or the street (the location list)" data-in="blankQ" data-enter="blankFirst" autocomplete="off" value="' + esc(b.q) + '" autofocus></label>' +

}
function blankResults(q) {

  return hits.map(function (i) { var l = LOCS.list[i]; return '<button class="res" data-act="blankPick" data-i="' + i + '"><span class="nm">' + esc(l[0]) + "<small>" + esc(l[1] || "no address on the list") + "</small></span></button>"; }).join("");

ACT.blankList = function () { if (!BL) return; BL.mode = LOCS ? "search" : "nolist"; blankRedraw(); };

/* ---------- packing ---------- */
function slipTouched() { return S.pack && S.pack.lines.some(function (l) { return l.sent != null; }); }
function saveDraft() { LS.set("draft", S.pack); }
function startPack(o, opts) {
  opts = opts || {};
  var lines = (opts.lines || o.lines || []).map(function (l) {
    var it = itemOf(l.id), ordered = C.num(l.ordered);
    if (it && l.src === "form" && l.raw != null) ordered = C.round(C.num(l.raw) * (it.op || it.p || 1) / (it.p || 1), 3);   // today's pack size
    return { id: l.id, ordered: ordered, sent: null, note: "", src: l.src || "form", name: l.name || "", unit: l.unit || "" };
  });
  S.pack = {
    order: opts.blank ? null : (o.num || null), follow: opts.follow || null, blank: !!opts.blank,
    shipTo: o.practice || "", address: o.address || "", contact: o.contact || "", phone: o.phone || "", email: o.email || "",
    comments: o.comments || "", stat: !!o.stat, when: o.when || "",
    lines: lines, sugs: opts.follow ? [] : C.parseComments(o.comments || "", CAT).filter(function (s) { return s.id; }).map(function (s) { s.added = false; return s; }),
    boxes: 1, by: S.packer || (SET.packers && SET.packers[0]) || "", notes: "", started: new Date().toISOString()
  };
  // the ship-to: the location list's exact name and address when the order matches it (or a pick remembered for this name
  // and street); otherwise the packer picks one or types it in (John, 5 Oct)
  var ty = { n: S.pack.shipTo, a: S.pack.address }, ix = locIx(), hit = ix ? C.locHit(ty.n, ty.a, ix, locMemo()) : null;
  S.pack.typed = ty; S.pack.loc = ix ? "" : "nolist";
  if (opts.loc) S.pack.loc = opts.loc;   // a slip without an order: picked from the list or typed in already
  else if (hit) { S.pack.shipTo = hit.n; if (hit.a) S.pack.address = hit.a; S.pack.loc = hit.manual ? "manual" : hit.how; }
  closeSheet(); S.view = "pack"; saveDraft(); render(); window.scrollTo(0, 0);
}

  var reasons = [["", "Backordered (send the rest later)"], ["Not stocked here", "Not stocked here (won’t be sent)"], ["Sent a substitute", "Sent a substitute"], ["Site asked for less", "Site asked for less"], ["Other", "Other (won’t be sent)"]];
  if (canDirect) reasons.splice(1, 0, [C.DIRECT, "Shipped direct (McKesson)"]);

  return '<div class="line' + (direct ? " picked direct" : short ? " short" : picked ? " picked" : l.out ? " short" : "") + '" id="ln' + i + '">' + loc +
    '<div><div class="nm">' + esc(it.n || l.name) + "</div>" +
    '<div class="sub2"><span>' + esc(C.unitLabel(it)) + "</span>" +
    '<span class="' + (low ? "lowstock" : "") + '">On hand: ' + esc(onHandText(it, r)) + "</span>" +
    (l.src === "comment" ? "<span>from comments</span>" : l.src === "added" ? "<span>added</span>" : l.src === "backorder" ? "<span>backorder</span>" : "") +
    (l.src !== "form" ? '<button class="link" data-act="removeLine" data-i="' + i + '">Remove</button>' : "") +
    (canDirect && !direct && C.num(l.ordered) > 0 ? '<button class="link" data-act="shipDirect" data-i="' + i + '" title="McKesson ships this line to the site">Ship direct</button>' : "") + "</div></div>" +
